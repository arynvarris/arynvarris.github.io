<!DOCTYPE html>
<html>

<head>
<title>Florida</title>

<style>
    body {

    h2, p {
    margin: 10px;
    }

    ul {
    list-style-type: none;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #057171;
    }

    ul li {
    float: left;
    }

    ul li a {
    display: block;
    color: rgb(255, 233, 196);
    text-align: center;
    padding: 14px 16px;
    text-decoration: none;
    }

    ul li a:hover {
    background-color: #111111;
    }

    div.gallery {
    display: flex;
    flex-wrap: nowrap;
    justify-content: flex-start;
    }

    div.gallery-item {
    margin: 5px;
    border: 1px solid #ccc;
    width: 180px;
    }

    div.gallery-item:hover {
    border: 1px solid #777;
    }

    div.gallery-item img {
    width: 100%;
    height: auto;
    }

    div.gallery-item div.desc {
    padding: 15px;
    text-align: top;
    }

    .container {
    display: flex;
    background-color: DodgerBlue;
    }

    .container div {
    background-color: #f1f1f1;
    margin: 10px;
    padding: 20px;
    font-size: 24px;
    }
