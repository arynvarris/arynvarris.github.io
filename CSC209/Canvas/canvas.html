<!DOCTYPE html>
<html>
<head>
<title>Canvas</title>
</head>
<body>

<h1> My Canvas</h1>
<canvas id="myCanvas" width="800" height="500" style="border:1px solid #000000;"></canvas>

<script>
const c = document.getElementById("myCanvas");
const ctx = c.getContext("2d");

const spacing = 40; // space between circles
const radius = 20; // circle radius
const columns = 3; // circles per row

// draws circle 6 times
for (let i = 0; i < 6; i++) {
    // finds next available column and row
    const col = i % columns;
    const row = Math.floor(i % cols);

    // finds the x and y coords
    const x = radius + col * (radius * 2 + spacing);
    const y = radius + row * (radius * 2 + spacing);

    // draws the circle
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, 2 * Math.PI);
    ctx.stroke();

}

</script>

</body>
</html>
