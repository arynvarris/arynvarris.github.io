<!DOCTYPE html>
<html lang="en"> <!-- Declares language as English, not neccessary -->
<head>
    <title>CSS Float Layout</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Allows the use of accordian classes -->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">

    <!-- Inner CSS styling for layout -->
    <style>
        /* Asterisk is a universal selector, selecting everything on the page */
        * {
            box-sizing: border-box;
        }
     
        /* Styling for the body */
        body {
            font-family: Arial, Helvetica, sans-serif;
            /*increases the length of the page*/
            min-height: 100vh;
        }

        /* Stying for the header */
        header {
            background-color: #666;
            padding: 30px;
            text-align: center;
            font-size: 35px;
            color: white;
            margin-top: 10px;
        }

        /* Create two columns/boxes that floats next to each other */
        nav {
            float: left;
            width: 30%;
            height: 445px; /* edit to change size of center content, nav and body */
            background: #ccc;
            padding: 20px;
        }

        /* Style the list inside the menu */
        nav ul {
            list-style-type: none;
            padding: 0;
        }

        article {
            float: left;
            padding: 20px;
            width: 70%;
            background-color: #f1f1f1;
            height: 445px; /* only for demonstration, should be removed */
        }

        /* Clear floats after the columns */
        section::after {
            content: "";
            display: table;
            clear: both;
        }

        /* Style the footer */
        footer {
            background-color: #777;
            padding: 10px;
            text-align: center;
            color: white;
        }

        /* Responsive layout - makes the two columns/boxes stack on top of each other instead of next to each other, on small screens */
        @media (max-width: 600px) {
        nav, article {
            width: 100%;
            height: auto;
        }
        }
    </style>
</head>

<body class="w3-container">

    <!-- Header for the body or main page -->
    <header>
        <h2> Header </h2>
    </header>

    <!-- Accordian, with displaying dropdownv-->
    <button onclick="accordian('Demo3')" class="w3-btn w3-block w3-red">
    Centered and full-width</button>

    <div id="Demo3" class="w3-hide w3-container w3-center w3-pale-red">
    <p>Centered content as well!</p>
    </div>

    <!-- Main center section of the page containing most of the content -->
    <section>
        <!-- Navigation links-->
        <nav>
            <!-- Unordered List containing links-->
            <ul>
                <li><a href="#"> List Item 1 </a></li>
                <li><a href="#"> List Item 2 </a></li>
                <li><a href="#"> List Item 3 </a></li>
            </ul>
        </nav>
        
        <article>
            <h1> Title </h1>
            <p> Paragraph Content.</p>
            <p> Paragraph Content.</p>
        </article>
    </section>

    <footer>
        <p>Footer</p>
    </footer>

    <!-- Function for toggling and displaying the accordian-->
    <script>
    function accordian(id) {
        document.getElementById(id).classList.toggle("w3-show");
    }
    </script>

</body>
</html>
