<!DOCTYPE html>
<html>

<head>

    <title>Where To</title>

    <!-- JS can be placed in the head -->
    <script>
        function changeText() {
            document.getElementById("demo").innerHTML = "Paragraph changed.";
        }
    </script>

</head>

<body>

    <h1>JS Where To</h1>

    <p id="demo">A Paragraph</p>

    <!-- Calls the JavaScript function when clicked -->
    <button onclick="changeText()">Click Me</button>

    <!-- JS can also be put in the body -->
    <script>
        // JS code can go here
    </script>

    <!-- Links to an external JS file -->
    <script src="myScript.js"></script>

</body>

</html>
