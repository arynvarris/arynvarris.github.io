<!DOCTYPE html>
<html>

<head>
    <title>Random</title>
</head>

<body>

    <h1>JS Random</h1>

    <script>
        // Random number from 0 up to 1
        Math.random();

        // Random whole number from 0 to 9
        Math.floor(Math.random() * 10);

        // Random whole number from 0 to 10
        Math.floor(Math.random() * 11);

        // Random whole number from 1 to 10
        Math.floor(Math.random() * 10) + 1;
    </script>

</body>

</html>
