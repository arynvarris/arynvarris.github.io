<!DOCTYPE html>
<html>
<head>
<title>Page Title</title>
</head>

<meta charset="UTF-8">
    <title>Image List Example</title>
    <style>
        /* Styling for images */
        img {
            width: 150px;
            height: auto;
            margin: 5px;
        }
    </style>
</head>

<body>
    <!-- Paragraph element where images will be inserted -->
    <p id="imageList"></p>

<script>

    // Array of image file names that are stored in 'images' folder
    const imageFiles = ["photo1.jpg", "photo2.jpg", "photo3.jpg", "photo4.jpg", "photo5.jpg"];
    //

    // Reference to the paragraph element
    const paragraph = document.getElementById("imageList");

    // Build HTML string with <img> tags
    let htmlContent = "";

    // For loop that iterates through each image in the images folder
    for (let i = 0; i < imageFiles.length; i++) {
        // Template to create <img> tag, it is appending the new tag to an existing variable htmlContent
        htmlContent += `<img src="images/${imageFiles[i]}" alt="Image ${i + 1}"><br>`;
    }

    // Insert the generated HTML into the paragraph
    paragraph.innerHTML = htmlContent;

</script>

</body>
</html>
